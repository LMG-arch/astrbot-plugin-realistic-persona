desc: "拟人化角色行为系统：整合情绪感知、生活模拟、QQ空间日记、AI配图、异步思考循环、人格演化系统、情绪驱动的自动换头像/昵称/签名、人生故事引擎、独立新闻获取模块、图像生成检测功能等功能，使用系统人设，符合AstrBot开发文档规范。v1.20.0: 新增主动分享功能——根据日程、天气、对话历史和人设主动分享生活状态。v1.19.4: 修复ModelScope绘图API异步模式兼容（需设置X-ModelScope-Async-Mode头）。v1.19.3: 支持独立配置自动回复QQ空间评论（不依赖自动发说说）。v1.19.2: 修复异步思考调度器回调参数缺失导致插件加载失败、支持异步回调"
